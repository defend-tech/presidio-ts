name: Publish TypeScript Packages

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PUBLISH_PRIVATE_PACKAGES to authorize this manual publication.
        required: true
        type: string
      source_ref_sha:
        description: Full commit SHA selected for this dispatch; must equal the checked-out source ref.
        required: true
        type: string
      resume_existing:
        description: Resume only when every existing version has the exact packed integrity expected here.
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish @defend-tech packages
    runs-on: ubuntu-latest
    environment: github-packages
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EXPECTED_SOURCE_SHA: ${{ inputs.source_ref_sha }}
      ALLOW_RESUME: ${{ inputs.resume_existing }}
      REGISTRY_URL: https://npm.pkg.github.com
    steps:
      - name: Require explicit manual confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "PUBLISH_PRIVATE_PACKAGES"

      - name: Checkout selected source ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Record and verify source ref
        run: |
          set -euo pipefail
          actual_sha=$(git rev-parse HEAD)
          test "$actual_sha" = "$GITHUB_SHA"
          test "$actual_sha" = "$EXPECTED_SOURCE_SHA"
          {
            echo "## Publication source"
            echo "- Ref: \`$GITHUB_REF\`"
            echo "- SHA: \`$actual_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@defend-tech"

      - name: Install dependencies
        run: npm ci

      - name: Validate release artifacts
        run: npm run release:check

      - name: Preflight every package version
        run: |
          set -euo pipefail
          packages=(core analyzer anonymizer structured image-redactor cli)
          pack_dir="$RUNNER_TEMP/publish-packages"
          plan="$RUNNER_TEMP/publish-plan.tsv"
          mkdir -p "$pack_dir"
          : > "$plan"
          failed=false

          for package in "${packages[@]}"; do
            manifest="packages/${package}/package.json"
            metadata="$pack_dir/${package}.json"
            npm pack --workspace="packages/${package}" --pack-destination="$pack_dir" --json > "$metadata"
            read -r name version integrity filename < <(node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const [packed] = JSON.parse(readFileSync(process.argv[1], "utf8"));
              if (!packed?.name || !packed?.version || !packed?.integrity || !packed?.filename) process.exit(1);
              console.log([packed.name, packed.version, packed.integrity, packed.filename].join(" "));
            ' "$metadata")
            archive="$pack_dir/$filename"
            error_file="$pack_dir/${package}.npm-view-error"

            if registry_metadata=$(npm view "${name}@${version}" --registry="$REGISTRY_URL" --json 2>"$error_file"); then
              registry_integrity=$(node --input-type=module -e '
                const metadata = JSON.parse(process.argv[1]);
                if (metadata?.name !== process.argv[2] || metadata?.version !== process.argv[3] || !metadata?.dist?.integrity) process.exit(1);
                console.log(metadata.dist.integrity);
              ' "$registry_metadata" "$name" "$version") || {
                echo "Registry metadata for ${name}@${version} is incomplete; refusing to publish."
                failed=true
                continue
              }
              if [ "$registry_integrity" != "$integrity" ]; then
                echo "${name}@${version} exists with a different integrity; refusing to publish."
                failed=true
                continue
              fi
              if [ "$ALLOW_RESUME" != "true" ]; then
                echo "${name}@${version} already exists; rerun only with resume_existing after reviewing the partial release."
                failed=true
                continue
              fi
              action=skip
              echo "${name}@${version} already exists with the expected integrity; it will be skipped."
            elif grep -Eq 'npm error code E404|(^|[^[:alnum:]_])E404([^[:alnum:]_]|$)' "$error_file"; then
              action=publish
              echo "${name}@${version} is absent (explicit npm E404)."
            else
              echo "Registry lookup for ${name}@${version} failed without an explicit npm E404; refusing to publish."
              failed=true
              continue
            fi

            printf '%s\t%s\t%s\t%s\t%s\n' "$action" "$name" "$version" "$integrity" "$archive" >> "$plan"
          done

          if [ "$failed" = true ]; then
            exit 1
          fi
          {
            echo "## Registry preflight"
            echo "All six package name/version pairs were checked before any publish command."
            echo "Resume enabled: \`$ALLOW_RESUME\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish preflight-approved package archives
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/publish-plan.tsv"
          while IFS=$'\t' read -r action name version integrity archive; do
            if [ "$action" = "skip" ]; then
              echo "Skipping verified existing ${name}@${version}."
              continue
            fi
            npm publish "$archive" --registry="$REGISTRY_URL"
          done < "$plan"
